plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kosign.wecms'
version = '0.0.1-SNAPSHOT'
description = 'wecms-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly     'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly     'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Apache POI — XLSX generation for the shared Excel export feature
    // (common/export/). SXSSF is the streaming variant used by
    // ExcelWorkbookWriter so a 50k-row export stays bounded in heap.
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    // Coocon iSAS SEED-CBC cipher (com.coocon.securty.util.ISASSeedCBC) —
    // licensed Coocon asset, reused verbatim from the legacy JEX system
    // (WECMS DEV/WECMS/lib/isas1.0.jar) under PO/Coocon approval (B1,
    // 2026-06-05) to decrypt NXiSAS engine `Output.Result` for Own
    // Account Transfer with byte-for-byte legacy parity. Self-contained
    // (KISA SEED-128 CBC + iSASBase64, no transitive deps). Decrypt is
    // gated by `wecms.oat.seed-decrypt.enabled` (default false). See
    // docs/jex/features/own-account-transfer/b1-decrypt-implementation-plan.md.
    implementation files('libs/isas1.0.jar')

    // ShedLock — distributed lock for @Scheduled tasks so multi-instance
    // deploys don't double-fire the Exchange Rate batches (or any future
    // scheduled job). Backing store: the existing PostgreSQL via
    // JdbcTemplateLockProvider — no Redis / Zookeeper / etc. needed.
    // The `shedlock` lock table is created by running the schema SQL manually
    // (src/main/resources/db/migration/ — formerly Flyway V210), not at runtime.
    implementation 'net.javacrumbs.shedlock:shedlock-spring:5.16.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:5.16.0'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    // External Tomcat hosts the WAR — embedded Tomcat must NOT ship inside it.
    providedRuntime 'org.springframework.boot:spring-boot-starter-tomcat'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}


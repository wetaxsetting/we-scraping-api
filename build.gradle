plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.13'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.kosign.wecms'
version = '0.0.1-SNAPSHOT'
description = 'wecms-api-main'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly     'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly     'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Apache POI — XLSX generation for the shared Excel export feature
    // (common/export/). SXSSF is the streaming variant used by
    // ExcelWorkbookWriter so a 50k-row export stays bounded in heap.
    implementation 'org.apache.poi:poi-ooxml:5.2.5'

    implementation 'org.flywaydb:flyway-core'
    runtimeOnly    'org.flywaydb:flyway-database-postgresql'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}

// One-time helper: repair V86/V87 checksum mismatch on the shared dev DB.
// Run with:  ./gradlew repairFlywayChecksums
// Safe to run multiple times (WHERE clause matches only the old value or
// the correct value is already stored — the UPDATE is a no-op in both cases).
tasks.register('repairFlywayChecksums', JavaExec) {
    group = 'flyway'
    description = 'Repair V86/V87 checksum mismatch in flyway_schema_history on the shared dev DB'
    dependsOn compileJava

    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.kosign.wecms.tool.FlywayChecksumRepair'
}


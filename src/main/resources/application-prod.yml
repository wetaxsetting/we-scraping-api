# PROD profile. RESERVED — not used in the 8-day R&D sprint (no PROD deploy).
# Hard rules for this file:
#   - ddl-auto MUST be 'validate'. Never 'update', never 'create', never 'create-drop'.
#   - SQL logging OFF. No show-sql, no format_sql.
#   - No secrets in this file. All sensitive values come from env vars.
#   - Schema changes are applied manually in the DB (Flyway removed 2026-06-10).
#     PROD will only boot if the schema is already fully migrated out-of-band;
#     run the SQL under src/main/resources/db/migration/ by hand against the DB.

spring:
  # Per-profile env file. On the PROD host the WECMS_DB_* values come from the
  # process environment (setenv.sh / orchestrator secrets); .env.prod (copy of
  # .env.prod.example) is the optional convenience for an out-of-cluster run.
  config:
    import: optional:file:./.env.prod[.properties]
  # Datasource — standardized WECMS_DB_* trio (same structure in every profile).
  # NO defaults and NO host/credentials committed: a missing value leaves the
  # ${...} placeholder unresolved and the app fails fast at startup, so PROD can
  # never silently fall through to a dev DB. The target PROD DB schema must be
  # pre-migrated out-of-band (Flyway removed 2026-06-10; ddl-auto=validate only
  # checks mappings). See docs/security/required-environment-secrets.md.
  datasource:
    url: ${WECMS_DB_URL}
    username: ${WECMS_DB_USERNAME}
    password: ${WECMS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Firm-banking payment dispatch (EFS / VAN gateway). Every environment-specific
# value comes from an env var — NO secrets, URLs, IPs, or keys in this file. All
# switches default OFF so the app boots inert until ops provisions the gateway.
# (Merged on top of the base application.yml `wecms:` tree.)
# Required PROD env vars when activating the bulk flow:
#   WECMS_EFS_ENABLED=true · WECMS_EFS_BASE_URL=<van-gw> · WECMS_EFS_PARTNER_ID
#   WECMS_SFTP_ENABLED=true · WECMS_SFTP_HOST · WECMS_SFTP_USERNAME · WECMS_SFTP_KEY_PATH
#   WECMS_DISPATCH_AUTO_RECEIVE=true · WECMS_CALLBACK_ALLOWED_IPS=<gateway IPs>
#   (the per-VAN API_KEY is NOT an env var — it lives in TB_VAN_API_INFO, B2)
wecms:
  # File storage roots — REQUIRED on PROD (no default → fail-fast). The base
  # application.yml defaults these to ./tmp/* which is unsafe for a server (an
  # ephemeral path). Declared bare here so a missing value aborts startup instead
  # of silently writing uploads to ./tmp. Set via .env.prod / OS env to real disk.
  overseas-payment:
    storage-root: ${WECMS_OVERSEAS_PAYMENT_STORAGE_ROOT}
  vendor-payment:
    storage-root: ${WECMS_VENDOR_PAYMENT_STORAGE_ROOT}
  expense-payment:
    storage-root: ${WECMS_EXPENSE_PAYMENT_STORAGE_ROOT}
  payroll:
    storage-root: ${WECMS_PAYROLL_STORAGE_ROOT}
  contacts:
    storage-root: ${WECMS_CONTACTS_STORAGE_ROOT}
  preferences:
    storage-root: ${WECMS_PREFERENCES_STORAGE_ROOT}
  user-image:
    storage-root: ${WECMS_USER_IMAGE_STORAGE_ROOT}
  erp-transaction-history:
    storage-root: ${WECMS_ERP_TRANSACTION_HISTORY_STORAGE_ROOT}
  internal-transfer:
    storage-root: ${WECMS_INTERNAL_TRANSFER_STORAGE_ROOT}
  dispatch:
    auto-receive: ${WECMS_DISPATCH_AUTO_RECEIVE}
    realtime-dispatch: ${WECMS_DISPATCH_REALTIME_DISPATCH}
    recipient-inquiry: ${WECMS_DISPATCH_RECIPIENT_INQUIRY}
    result-check:
      cron: ${WECMS_DISPATCH_RESULT_CHECK_CRON}
    callback:
      trust-forwarded-for: true
      allowed-ips: ${WECMS_CALLBACK_ALLOWED_IPS}
    efs:
      enabled: ${WECMS_EFS_ENABLED}
      base-url: ${WECMS_EFS_BASE_URL}
      partner-id: ${WECMS_EFS_PARTNER_ID}
      connect-timeout-ms: 3000
      read-timeout-ms: 20000
    sftp:
      enabled: ${WECMS_SFTP_ENABLED}
      host: ${WECMS_SFTP_HOST}
      port: ${WECMS_SFTP_PORT}
      username: ${WECMS_SFTP_USERNAME}
      private-key-path: ${WECMS_SFTP_KEY_PATH}
      password: ${WECMS_SFTP_PASSWORD}
      connect-timeout-ms: 60000
      local-upload-path: ${WECMS_SFTP_LOCAL_UPLOAD}
      remote-upload-path: ${WECMS_SFTP_REMOTE_UPLOAD}
      local-download-path: ${WECMS_SFTP_LOCAL_DOWNLOAD}
      remote-download-path: ${WECMS_SFTP_REMOTE_DOWNLOAD}
      remote-move-path: ${WECMS_SFTP_REMOTE_MOVE}

# Coocon + OSMC: ALL variables MUST be set as environment variables in PROD.
# These keys are re-declared here WITHOUT a default specifically to OVERRIDE the
# DEV defaults in the base application.yml — otherwise a missing env var would
# silently fall through to the DEV gateway/credentials. With no default the
# `${VAR}` placeholder fails fast at startup, so PROD never boots against DEV.
# The smart-api-url + smart-api-key pair drives BOTH the FX-rate batch AND the
# bank-scraping flow (NXISAS reuses the same smart-gateway with the same
# credentials — there is no separate WECMS_NXISAS_* set). PROD/UAT host
# (Sonny, 2026-05-28):
#   https://sgw.webcashvietnam.com/domestic/finance/scrap/smart_gateway.jsp
# Required env vars:
#   WECMS_COOCON_API_KEY · WECMS_COOCON_API_URL · WECMS_COOCON_SMART_API_KEY
#   WECMS_COOCON_SMART_API_URL · WECMS_COOCON_UNIQUE_KEY
#   WECMS_OSMC_URL · WECMS_OSMC_API_KEY · WECMS_OSMC_API_ID · WECMS_OSMC_UNIQUE_KEY
  coocon:
    api-key:       ${WECMS_COOCON_API_KEY}
    api-url:       ${WECMS_COOCON_API_URL}
    smart-api-key: ${WECMS_COOCON_SMART_API_KEY}
    smart-api-url: ${WECMS_COOCON_SMART_API_URL}
    unique-key:    ${WECMS_COOCON_UNIQUE_KEY}
  osmc:
    url:        ${WECMS_OSMC_URL}
    api-key:    ${WECMS_OSMC_API_KEY}
    api-id:     ${WECMS_OSMC_API_ID}
    unique-key: ${WECMS_OSMC_UNIQUE_KEY}

# =============================================================================
# HAENGSUNG Oracle ERP integration
# =============================================================================
# Same property bindings as the base application.yml, declared per-profile for
# explicit visibility. OFF by default; real values resolve from env vars. No
# secrets in YAML.
haengsung:
  oracle:
    enabled: ${HAENGSUNG_ORACLE_ENABLED}
    url: ${HAENGSUNG_ORACLE_URL}
    username: ${HAENGSUNG_ORACLE_USERNAME}
    password: ${HAENGSUNG_ORACLE_PASSWORD}
  scheduled-payment-import:
    enabled: ${HAENGSUNG_SCHEDULED_IMPORT_ENABLED}
    cron: ${HAENGSUNG_SCHEDULED_IMPORT_CRON}
  exchange-rate-sync:
    enabled: ${HAENGSUNG_EXCHANGE_RATE_SYNC_ENABLED}
    cron: ${HAENGSUNG_EXCHANGE_RATE_SYNC_CRON}
  card-account-sync:
    enabled: ${HAENGSUNG_CARD_ACCOUNT_SYNC_ENABLED}
    cron: ${HAENGSUNG_CARD_ACCOUNT_SYNC_CRON}

logging:
  level:
    root: WARN
    com.kosign.wecms: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# =============================================================================
# PROD PROFILE — production host
# =============================================================================
# THIS FILE HOLDS ONLY WHAT DIFFERS PER ENVIRONMENT (restructured 2026-09-29).
# Every shared key — datasource, dispatch, storage roots, Coocon/OSMC, Zalo,
# batches, Haengsung — is declared ONCE in application.yml as a bare ${VAR} and
# inherited here. Its value comes from .env.prod (on a server, exported by
# bin/setenv.sh). Never re-declare a shared key in this file.
#
# All four profile files declare the SAME 10 knobs, in the same order. Change a
# value here; add a new knob to all four files or to none.
#
# Variables: 76, all read by application.yml. The checklist is .env.prod.example
# (keys only). See application.yml's header for the full contract.
#
# >>> DEPLOY ORDER: the host .env.prod (bin/setenv.sh) MUST carry every variable
# >>> BEFORE a war built from this config is deployed, or the app does not start.
#
# HOW THIS PROFILE DIFFERS: quiet logging (root WARN, no SQL) and error messages
# hidden from clients. Alert env-mode R.
#
# OPEN GAP (unchanged by the 2026-09-29 restructure, approval-gated): .env.prod
# keeps the read-only stuck-monitor OFF (false + "-") and alerting OFF. With both
# off, the two states from the batch-1 fail-closed fix have NO detection path in
# prod:
#   * BULK_EXECUTION_UNCONFIRMED — a 00302 was issued and never confirmed. The
#     bank MAY already have executed the batch.
#   * BULK_EXECUTION_NOT_ISSUED  — the JVM died between the commit and the
#     post-commit hook, so no 00302 was ever sent.
# Neither retries; both resolve only by operator action and stay invisible until
# someone queries TB_FIRM_FILE_MST by hand. Procedure:
# docs/deployment/bulk-file-reconciliation-procedure.md. Turning the monitor on
# is a value change in .env.prod, not in this file.
# =============================================================================
spring:
  config:
    import: optional:file:./.env.prod[.properties]
  jpa:
    show-sql: false
    properties:
      hibernate.format_sql: false

server:
  error:
    include-message: never

logging:
  level:
    root: WARN
    com.kosign.wecms: INFO
    org.hibernate.SQL: WARN
    org.springframework.jdbc.core: WARN
    org.springframework.jdbc.core.StatementCreatorUtils: WARN
    org.hibernate.orm.jdbc.bind: WARN

# PROD profile. RESERVED — not used in the 8-day R&D sprint (no PROD deploy).
# Hard rules for this file:
#   - ddl-auto MUST be 'validate'. Never 'update', never 'create', never 'create-drop'.
#   - SQL logging OFF. No show-sql, no format_sql.
#   - No secrets in this file. All sensitive values come from env vars.
#   - Schema changes ship via Flyway migrations only.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    # Flyway disabled for this profile (2026-06-07, per ops request to turn
    # Flyway off across all environments). NOTE: this contradicts the file
    # header rule ("Schema changes ship via Flyway migrations only") and the
    # ddl-auto: validate dependency above — PROD will only boot if the schema
    # is already fully migrated out-of-band. Re-enable before any deploy that
    # relies on Flyway to apply pending migrations.
    enabled: false
    baseline-on-migrate: false
    # PROD must never tolerate checksum drift or out-of-order applies.
    # These flags pin the strict defaults so the relaxed local-R&D
    # values in `application.yml` cannot accidentally leak through.
    out-of-order: false
    validate-on-migrate: true

server:
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

# Coocon: ALL five variables MUST be set as environment variables in PROD.
# There are no defaults here — the app will refuse to start with a missing
# value. The smart-api-url + smart-api-key pair drives BOTH the FX-rate batch
# AND the bank-scraping flow (NXISAS reuses the same smart-gateway with the
# same credentials — there is no separate WECMS_NXISAS_* set). PROD/UAT host
# (Sonny, 2026-05-28):
#   https://sgw.webcashvietnam.com/domestic/finance/scrap/smart_gateway.jsp
# Required env vars:
#   WECMS_COOCON_API_KEY
#   WECMS_COOCON_API_URL
#   WECMS_COOCON_SMART_API_KEY
#   WECMS_COOCON_SMART_API_URL
#   WECMS_COOCON_UNIQUE_KEY

logging:
  level:
    root: WARN
    com.kosign.wecms: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

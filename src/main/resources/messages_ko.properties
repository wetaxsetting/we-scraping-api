# Korean (ko) message bundle.
#
# The Spring `MessageSource` falls back to `messages.properties`
# (default English) for any key that's missing here. Until the
# refactor team adds Korean translations for the system error codes,
# this file only seeds the audit-log activity / detail keys the
# shared `AuditLogService` requires. Other keys (WBE codes, etc.)
# inherit English text via the bundle fallback chain.
#
# Source: legacy JEX `comm_0220_002_c001_act.jsp:148-157` /
# `comm_0220_003_u001_act.jsp:98-107` — the literal strings JEX wrote
# into `AUDIT_LOGS_ACTV_DTL` for KO locale rows. JEX historically
# wrote the same English text for KO and EN (see DEV `audit_logs_infm`
# rows at biz_key=VN_VNM0004_000001 — KO rows carry "Update
# firmbanking details" verbatim). The refactor matches.


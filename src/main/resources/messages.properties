#   WBE_OAT_TARGET_BANK_NAPAS_MISMATCH - supplied target_bank_cd doesn't match the NAPAS resolution
#   WBE_OAT_TARGET_NOT_FOUND         - target row missing / inactive / wrong tenant / wrong ccy

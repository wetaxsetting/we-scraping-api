# Login Credentials (refactor slug "login-credentials"; replaces legacy
# comm_0218_001/002/003/005/006/007/008/009/d001). Unified list endpoint
# spans BANK_CERT_INFO + GDT_CERT_INFO; delete + create + update write
# audit rows; reveal returns the decrypted password after re-auth.
#
# Original allocation collided with Internal Transfer's WBE2060–2068 and
# Bank-credentials scraping spike's WBE2060–2062 (the file has THREE
# parallel definitions of each code, and last-wins resolution meant the
# Login Credentials messages were never reached). Re-allocated to the
# next unused band 2026-05-14.
#
#   WBE2090 — credential not found in this tenant (single envelope
#             merges "not found" + "wrong tenant", same precedent as
#             WBE2014 / WBE_APPROVAL_LINE_NOT_FOUND).
#   WBE2091 — re-auth failed on the reveal endpoint (user-supplied
#             password does not match USER_INFM.USER_PW).
#   WBE2092 — unknown credential type in path (must be "bank" or "gdt").
# ----------------------------------------------------------------------------

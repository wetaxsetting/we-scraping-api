# ---------------------------------------------------------------------------
# Excel-upload SpecialCharValidator messages — consumed by every parser
# (Internal Transfer / Vendor / Expense / Payroll / Overseas). The
# validator builds the cell error via:
#   messageResolver.resolve("payment.upload.error.blocked_chars",
#                            fieldLabel, blockedCharsHit)
# `payment.upload.field.{FIELD_CD}` resolves the user-facing field name
# from the four-letter FieldCd code (RMKS / RCPT / MEMO / BENA / BEAD).
# Mirrors legacy `add_osmc.js#addHeaderInfoIcon` tooltip wording so the
# parse-preview cell error reads the same as the column-header tooltip.
# ---------------------------------------------------------------------------

# ----------------------------------------------------------------------------
# Settings > Users (refactor slug "user-management"; replaces legacy
# admn_0021_* family). No plan cap — legacy WbMessageCode.WBW1151
# defines "up to 5 users" but is never thrown (verified by Grep across
# the full JEX source); real tenants exceed 5. Single envelope on
# NOT_FOUND merges "not found" + "wrong tenant" — never leak the
# existence of another tenant's row.
#
#   WBE_USERS_NOT_FOUND                 — row missing or wrong tenant.
#   WBE_USERS_DUPLICATE_LOGIN_ID        — race-condition fallback for the
#                                         check-id endpoint; USER_INFM PK is global.
#   WBE_USERS_LOGIN_ID_REQUIRED         — check-id called with blank login_id.
#   WBE_USERS_CANNOT_DELETE_SELF        — actor tried to delete their own user.
#   WBE_USERS_CANNOT_DEMOTE_LAST_ADMIN  — demote / delete would leave 0 admins.
# ----------------------------------------------------------------------------
WBE_USERS_NOT_FOUND=User not found.
WBE_USERS_DUPLICATE_LOGIN_ID=This ID is already taken.
WBE_USERS_LOGIN_ID_REQUIRED=Login ID is required.
WBE_USERS_CANNOT_DELETE_SELF=You cannot delete your own account from this screen.
WBE_USERS_CANNOT_DEMOTE_LAST_ADMIN=At least one admin must remain.


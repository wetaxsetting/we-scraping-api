# Test profile. Used by integration tests (JUnit 5 + Testcontainers).
# create-drop is safe here because the schema is ephemeral per run.

spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: false

logging:
  level:
    com.kosign.wecms: DEBUG
    org.hibernate.SQL: DEBUG

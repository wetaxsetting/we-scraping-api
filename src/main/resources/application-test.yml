# Test profile. Used by integration tests (JUnit 5 + Testcontainers).
# ddl-auto set to `validate` 2026-06-07 (per ops request to prevent any
# automatic schema changes in every profile). WARNING: with Flyway disabled
# AND ddl-auto: validate, the test profile no longer builds a schema — any
# integration test that relied on create-drop to materialize an ephemeral
# schema will fail validation unless the test DB is pre-migrated.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true
  flyway:
    enabled: false

logging:
  level:
    com.kosign.wecms: DEBUG
    org.hibernate.SQL: DEBUG

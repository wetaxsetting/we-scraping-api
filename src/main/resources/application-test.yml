# Test profile. Used by integration tests (JUnit 5).
# Flyway removed 2026-06-10 — there is no automatic migration. ddl-auto stays
# `validate`, so the test profile does not build a schema: any integration test
# that needs tables must run against a pre-migrated DB (apply
# src/main/resources/db/migration/ SQL by hand). Pure-Mockito unit tests are
# unaffected.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.format_sql: true

logging:
  level:
    com.kosign.wecms: DEBUG
    org.hibernate.SQL: DEBUG

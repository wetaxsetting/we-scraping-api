# =============================================================================
# UAT PROFILE — user acceptance test host
# =============================================================================
# THIS FILE HOLDS ONLY WHAT DIFFERS PER ENVIRONMENT (restructured 2026-09-29).
# Every shared key — datasource, dispatch, storage roots, Coocon/OSMC, Zalo,
# batches, Haengsung — is declared ONCE in application.yml as a bare ${VAR} and
# inherited here. Its value comes from .env.uat (on a server, exported by
# bin/setenv.sh). Never re-declare a shared key in this file.
#
# All four profile files declare the SAME 10 knobs, in the same order. Change a
# value here; add a new knob to all four files or to none.
#
# Variables: 76, all read by application.yml. The checklist is .env.uat.example
# (keys only). See application.yml's header for the full contract.
#
# >>> DEPLOY ORDER: the host .env.uat (bin/setenv.sh) MUST carry every variable
# >>> BEFORE a war built from this config is deployed, or the app does not start.
#
# HOW THIS PROFILE DIFFERS: UAT runs against the LIVE JEX DB, which shapes its
# .env.uat — the read-only stuck-monitor is ON, every mutating dispatch leg is
# OFF, and recovery must stay off because refactor-written rows cannot be told
# apart from JEX-written ones. Alert env-mode U. Quiet logging (root WARN, no SQL)
# and error messages hidden from clients.
# =============================================================================
spring:
  config:
    import: optional:file:./.env.uat[.properties]
  jpa:
    show-sql: false
    properties:
      hibernate.format_sql: false

server:
  error:
    include-message: never

logging:
  level:
    root: WARN
    com.kosign.wecms: INFO
    org.hibernate.SQL: WARN
    org.springframework.jdbc.core: WARN
    org.springframework.jdbc.core.StatementCreatorUtils: WARN
    org.hibernate.orm.jdbc.bind: WARN

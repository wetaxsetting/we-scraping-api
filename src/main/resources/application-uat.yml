# UAT profile. RESERVED — not used in the 8-day R&D sprint (no UAT deploy).
# Created 2026-06-07 so a SPRING_PROFILES_ACTIVE=uat run does not fall through
# to base application.yml. Mirrors the PROD profile's hard rules.
# Hard rules for this file:
#   - ddl-auto MUST be 'validate'. Never 'update', never 'create', never 'create-drop'.
#   - SQL logging OFF. No show-sql, no format_sql.
#   - No secrets in this file. All sensitive values come from env vars.
#   - Schema changes are applied manually in the DB (Flyway removed 2026-06-10);
#     the target DB must be fully migrated out-of-band before the app boots.

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

logging:
  level:
    root: WARN
    com.kosign.wecms: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

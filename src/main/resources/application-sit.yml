# =============================================================================
# SIT / shared dev-server profile.
#
# Merged 2026-05-26 from:
#   - server-deployed application-sit.yml (had internal-transfer cutoff
#     table + show-sql/format_sql for SQL debugging)
#   - local repo application-sit.yml (had cors + user-image blocks)
# Also folded in former application-dev.yml content (2026-05-15 — dev was
# RESERVED/unused; show-sql + format_sql + coocon DEV credentials now live
# here).
# =============================================================================
# This file is .gitignored.
#
# Targets the shared WeCMS dev DB server at 172.168.5.172:5432/wecmsdevdb
# (requires office network / VPN reachability). Connection details are
# duplicated in:
#   - .mcp.json (postgres_dev_server_refactor entry — Claude's read-only SQL tool)
#   - run-local.bat / run-local.sh (host:port reachability check)
# Keep all three in sync if the server moves.
#
# All env vars below have a safe R&D default so the app starts out of the box,
# but you can still override them from the shell / IDE / run-local.bat /
# the local `.env` file (auto-loaded via spring.config.import in application.yml)
# or the SIT host's setenv.sh.
#
# Optional environment variables:
#   WECMS_DB_PASSWORD              — PostgreSQL password for `wecmsdev_owner`
#   WECMS_JWT_SECRET               — HS256 signing secret, 32+ characters
#   WECMS_CORS_ALLOWED_ORIGINS     — comma-separated cross-origin frontends
#   WECMS_*_STORAGE_ROOT           — per-feature file storage roots (6 keys)
#   WECMS_COOCON_*                 — Coocon external API overrides (5 keys)
#   WECMS_SHINHAN_BANK_CD          — internal-transfer cut-off bank code
#   WECMS_WOORI_BANK_CD            — internal-transfer cut-off bank code

spring:
  datasource:
    url: jdbc:postgresql://172.168.5.172:5432/wecmsdevdb
    username: wecmsdev_owner
    password: ${WECMS_DB_PASSWORD:P2CKJpDAnO#vUM146W$}
    driver-class-name: org.postgresql.Driver
  # Flyway removed 2026-06-10 — no automatic migration. The shared dev DB is
  # expected to be already migrated (apply src/main/resources/db/migration/ SQL
  # by hand). ddl-auto stays `validate` so Hibernate only checks mappings
  # against the existing schema.
  jpa:
    hibernate:
      ddl-auto: validate
    # Inherited from the former dev profile — log every SQL statement
    # with formatted output to aid query debugging. Override to false
    # in `.env` (spring.jpa.show-sql=false) if the noise bothers you.
    show-sql: true
    properties:
      hibernate.format_sql: true

wecms:
  # =============================================================================
  # Security (CORS / JWT)
  # =============================================================================
  cors:
    # Allowed cross-origin frontends. Includes localhost:3000 (Next.js dev
    # server) plus the SIT frontend at https://wecms.kosign.dev. Add more
    # comma-separated origins (e.g. UAT) as they come online. Override via
    # env var WECMS_CORS_ALLOWED_ORIGINS without redeploying the WAR.
    allowed-origins: ${WECMS_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://wecms.kosign.dev}
  jwt:
    # Local-only placeholder. Must be >= 32 characters for HS256.
    # NEVER use this value outside a developer laptop / SIT.
    # Generate a real one with: openssl rand -hex 64
    secret: ${WECMS_JWT_SECRET:local-rnd-dev-only-insecure-jwt-signing-secret-override-in-prod-abcdef123456}
  # =============================================================================
  # EFS / Van Center
  # =============================================================================
  # Firm-banking payment dispatch via the EFS / VAN gateway. DEV gateway per
  # REST API guide ver 1.2.2 §1.2 (DEV host) + §6 timeouts (connect 3s /
  # read 20s). Endpoint paths are vendor-fixed and default in EfsProperties;
  # only enabled + base-url + partner-id are env-specific. The Van Center API
  # key is NOT held here — it is a per-VAN secret provisioned out-of-band into
  # TB_VAN_API_INFO (B2) and read via VanApiKeyService. `enabled` defaults
  # false (mock active) until the partner instance + IP-whitelist are confirmed
  # (B1 / OQ-PDF-2). WGVN_EFS_204 is NOT configured — absent from guide
  # ver 1.2.2 (OQ-PDF-1).
  dispatch:
    efs:
      enabled: ${WECMS_EFS_ENABLED:false}
      base-url: ${WECMS_EFS_BASE_URL:https://dev-van-gw.webcashvietnam.com}
      partner-id: ${WECMS_EFS_PARTNER_ID:}
      connect-timeout-ms: 3000
      read-timeout-ms: 20000
  # =============================================================================
  # File storage
  # =============================================================================
  # All upload modules use:
  #   <storage-root>/<bizKey>/<module-slug>/<file>
  # Each module overrides its root via its WECMS_*_STORAGE_ROOT env var.
  #
  # Payment modules:
  #   Vendor Payment    -> <storage-root>/<bizKey>/vendor-payment/<file>
  #   Expense Payment   -> <storage-root>/<bizKey>/expense-payment/<file>
  #   Payroll           -> <storage-root>/<bizKey>/payroll/<file>
  #   Overseas Payment  -> <storage-root>/<bizKey>/overseas-payment/<file>
  #   Internal Transfer -> <storage-root>/<bizKey>/internal-transfer/<file>
  #
  # Business files:
  #   Contacts                -> <storage-root>/<bizKey>/contacts/<file>
  #   Preferences             -> <storage-root>/<bizKey>/preferences/<file>
  #   User Image              -> <storage-root>/<bizKey>/user-image/<file>
  #   ERP Transaction History -> <storage-root>/<bizKey>/erp-transaction-history/<file>
  #
  # Vendor Payment / Expense Payment / Payroll now have their own storage-root
  # keys (added 2026-06-12); each default mirrors the internal-transfer root so
  # today's layout is unchanged until a key is pointed elsewhere.
  # overseas-payment, preferences and user-image also fall back to a legacy flat
  # root for files written before the multi-tenant split.
  # Most roots default to "C:/WECMS PROJECT/File Data"; internal-transfer and
  # overseas-payment still default to different roots (flagged inline below).
  overseas-payment:
    # storage-root — NON-STANDARD: defaults to "D:/KOSIGN/WeCMS/File Data",
    # differs from the "C:/WECMS PROJECT/File Data" used by the other modules.
    # Leftover per-box path from the 2026-05-26 server-config merge
    # (commit a55344a); flagged for normalization (see the SIT-divergence
    # analysis). Override via WECMS_OVERSEAS_PAYMENT_STORAGE_ROOT.
    storage-root: ${WECMS_OVERSEAS_PAYMENT_STORAGE_ROOT:D:/KOSIGN/WeCMS/File Data}
  # vendor-payment / expense-payment / payroll — own roots; defaults mirror the
  # (non-standard) internal-transfer root "c:/WeCMS/File Data" so today's layout
  # is unchanged. Flagged for normalization alongside internal-transfer.
  vendor-payment:
    storage-root: ${WECMS_VENDOR_PAYMENT_STORAGE_ROOT:c:/WeCMS/File Data}
  expense-payment:
    storage-root: ${WECMS_EXPENSE_PAYMENT_STORAGE_ROOT:c:/WeCMS/File Data}
  payroll:
    storage-root: ${WECMS_PAYROLL_STORAGE_ROOT:c:/WeCMS/File Data}
  contacts:
    storage-root: ${WECMS_CONTACTS_STORAGE_ROOT:C:/WECMS PROJECT/File Data}
  preferences:
    storage-root: ${WECMS_PREFERENCES_STORAGE_ROOT:C:/WECMS PROJECT/File Data}
  user-image:
    # Save filename is an opaque HMAC token (defence-in-depth on top of
    # tenant isolation).
    storage-root: ${WECMS_USER_IMAGE_STORAGE_ROOT:C:/WECMS PROJECT/File Data}
  erp-transaction-history:
    storage-root: ${WECMS_ERP_TRANSACTION_HISTORY_STORAGE_ROOT:C:/WECMS PROJECT/File Data}
  # internal-transfer is listed last in this section because its YAML key also
  # carries the Banking Cut-off Configuration (next section): Spring binds that
  # under wecms.internal-transfer.cutoff, so it must stay nested under this key.
  internal-transfer:
    # storage-root — NON-STANDARD: defaults to "c:/WeCMS/File Data", differs from
    # the "C:/WECMS PROJECT/File Data" used by the other modules. Leftover
    # per-box path from the 2026-05-26 server-config merge (commit a55344a);
    # flagged for normalization. Override via WECMS_INTERNAL_TRANSFER_STORAGE_ROOT.
    storage-root: ${WECMS_INTERNAL_TRANSFER_STORAGE_ROOT:c:/WeCMS/File Data}

    # ===========================================================================
    # Banking cut-off configuration
    # ===========================================================================
    # Bound under wecms.internal-transfer.cutoff (CutoffProperties prefix), so it
    # stays nested under internal-transfer — but it is a distinct concern from
    # file storage. Vietnam-local cut-off windows from legacy
    # PymnHelper.getCutoffConfig; Shinhan past-cut-off is logged-only (non-blocking).
    cutoff:
      shinhan-bank-cd: ${WECMS_SHINHAN_BANK_CD:88886000}
      woori-bank-cd:   ${WECMS_WOORI_BANK_CD:11704000}
      shinhan:
        napas: { start: "00:05", end: "23:45" }
        citad: { start: "09:00", end: "15:30" }
        swift: { start: "09:00", end: "22:00" }
      woori:
        napas: { start: "00:15", end: "23:55" }
        citad: { start: "08:30", end: "17:40" }
        swift: { start: "08:30", end: "19:10" }

  # =============================================================================
  # Coocon
  # =============================================================================
  coocon:
    # Coocon DEV credentials — mirrors <coocon> in VI/jex.wabooks_new.user.xml.
    # Single source of truth for BOTH the FX-rate batch AND the bank-
    # scraping flow (NXISAS reuses smart-api-url + smart-api-key). SIT
    # uses the DEV host (Sonny, 2026-05-28); PROD host is reserved for
    # UAT/PROD. Override via WECMS_COOCON_* env vars (or set in `.env`).
    api-key: ${WECMS_COOCON_API_KEY:r2L7U6KnB4T51VokPlkg}
    api-url: ${WECMS_COOCON_API_URL:https://dev2.coocon.co.kr:8443/overseas/finance/scrap/bigdata_info.jsp}
    smart-api-key: ${WECMS_COOCON_SMART_API_KEY:fxAeocJbuweNTgv5FBns}
    smart-api-url: ${WECMS_COOCON_SMART_API_URL:https://dev-sgw.webcashvietnam.com:8443/domestic/finance/scrap/smart_gateway.jsp}
    unique-key: ${WECMS_COOCON_UNIQUE_KEY:0000099}

# =============================================================================
# Logging
# =============================================================================
logging:
  level:
    com.kosign.wecms: DEBUG
    org.springframework.security: INFO
    org.hibernate: info
    org.hibernate.SQL: debug
    org.springframework.jdbc.core: trace
    org.hibernate.orm.jdbc.bind: trace

# =============================================================================
# SIT PROFILE — system integration test host
# =============================================================================
# THIS FILE HOLDS ONLY WHAT DIFFERS PER ENVIRONMENT (restructured 2026-09-29).
# Every shared key — datasource, dispatch, storage roots, Coocon/OSMC, Zalo,
# batches, Haengsung — is declared ONCE in application.yml as a bare ${VAR} and
# inherited here. Its value comes from .env.sit (on a server, exported by
# bin/setenv.sh). Never re-declare a shared key in this file.
#
# All four profile files declare the SAME 10 knobs, in the same order. Change a
# value here; add a new knob to all four files or to none.
#
# Variables: 76, all read by application.yml. The checklist is .env.sit.example
# (keys only). See application.yml's header for the full contract.
#
# >>> DEPLOY ORDER: the host .env.sit (bin/setenv.sh) MUST carry every variable
# >>> BEFORE a war built from this config is deployed, or the app does not start.
#
# HOW THIS PROFILE DIFFERS: verbose logging (SQL shown, JDBC binds at TRACE) and
# full error messages. NOTE org.hibernate.orm.jdbc.bind at TRACE writes every
# bound SQL parameter VALUE (account numbers included) to catalina.out.
# In .env.sit the read-only stuck-monitor and ops alerting are ON (alert env-mode
# T); every mutating dispatch leg is OFF.
# On the SIT host CI copies /DATA/src-wecms/wecms-backend/environment/
# application-sit.yml over this file at build time — keep that host copy equal
# to this one.
# =============================================================================
spring:
  config:
    import: optional:file:./.env.sit[.properties]
  jpa:
    show-sql: true
    properties:
      hibernate.format_sql: true

server:
  error:
    include-message: always

logging:
  level:
    root: INFO
    com.kosign.wecms: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.jdbc.core: TRACE
    org.springframework.jdbc.core.StatementCreatorUtils: TRACE
    org.hibernate.orm.jdbc.bind: TRACE

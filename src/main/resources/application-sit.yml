# =============================================================================
# SIT / shared dev-server profile.
#
# Merged 2026-05-26 from:
#   - server-deployed application-sit.yml (had internal-transfer cutoff
#     table + show-sql/format_sql for SQL debugging)
#   - local repo application-sit.yml (had cors + user-image blocks)
# Also folded in former application-dev.yml content (2026-05-15 — dev was
# RESERVED/unused; show-sql + format_sql + coocon DEV credentials now live
# here).
# =============================================================================
# This file is TRACKED in Git and carries NO secrets (F-05). Every sensitive value
# resolves from an env var / the SIT host's setenv.sh / the gitignored .env.sit
# (copy of .env.sit.example). The committed profile is tracked; only the per-host
# .env.sit holding real values is gitignored.
#
# Targets the shared WeCMS dev DB server at 172.168.5.172:5432/wecmsdevdb
# (requires office network / VPN reachability). Connection details are
# duplicated in:
#   - .mcp.json (postgres_dev_server_refactor entry — Claude's read-only SQL tool)
#   - run-local.bat / run-local.sh (host:port reachability check)
# Keep all three in sync if the server moves.
#
# Secret values have NO in-file default (F-05): a missing REQUIRED value fails fast
# at startup. Provide values via the shell / IDE / run-local.bat / the gitignored
# .env.sit (auto-loaded via spring.config.import) / the SIT host's setenv.sh.
# Full list + which are required: docs/security/required-environment-secrets.md.
#
# Environment variables (DB password, JWT secret, and Coocon keys are REQUIRED — fail-fast):
#   WECMS_DB_PASSWORD              — PostgreSQL password for `wecmsdev_owner` (required)
#   WECMS_JWT_SECRET               — HS256 signing secret, 32+ bytes (required)
#   WECMS_COOCON_*                 — Coocon external API keys / urls (keys required)
#   WECMS_CRYPTO_LEGACY_CERT_SEED  — legacy cert-cipher seed (default `wabooksvn`; must equal legacy)
#   WECMS_CORS_ALLOWED_ORIGINS     — comma-separated cross-origin frontends
#   WECMS_*_STORAGE_ROOT           — per-feature file storage roots
#   WECMS_SHINHAN_BANK_CD          — internal-transfer cut-off bank code
#   WECMS_WOORI_BANK_CD            — internal-transfer cut-off bank code

spring:
  # Per-profile env file. Loaded on top of the base ./.env (imported in
  # application.yml). On the SIT host these come from setenv.sh / OS env; a local
  # .env.sit (copy of .env.sit.example) can be used for a developer SIT run.
  config:
    import: optional:file:./.env.sit[.properties]
  datasource:
    # Standardized WECMS_DB_* trio (same structure in every profile). NO host /
    # username / password committed here anymore — all three come from env
    # (.env.sit or OS env). Missing WECMS_DB_URL/USERNAME/PASSWORD → fail-fast.
    # The previously-committed shared-dev values MUST be rotated by infra/ops —
    # see docs/security/required-environment-secrets.md.
    url: ${WECMS_DB_URL}
    username: ${WECMS_DB_USERNAME}
    password: ${WECMS_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  # Flyway removed 2026-06-10 — no automatic migration. The shared dev DB is
  # expected to be already migrated (apply src/main/resources/db/migration/ SQL
  # by hand). ddl-auto stays `validate` so Hibernate only checks mappings
  # against the existing schema.
  jpa:
    hibernate:
      ddl-auto: validate
    # F-06: SQL logging OFF in SIT — SIT runs against the shared DB with real
    # credentials, so SQL statements / bind values must not reach the logs.
    # (Matches the -uat / -prod hard rule.) Re-enable locally via `.env` only.
    show-sql: false
    properties:
      hibernate.format_sql: false

wecms:
  # =============================================================================
  # Security (CORS / JWT)
  # =============================================================================
  jwt:
    # F-01: NO secret default — SIT is a deployed, network-reachable environment
    # and must never sign tokens with a repo-resident secret. WECMS_JWT_SECRET is
    # mandatory; a missing (or the retired insecure placeholder) value fails fast
    # in JwtTokenProvider at startup. Generate one with: openssl rand -hex 64
    secret: ${WECMS_JWT_SECRET}
  cors:
    # No default — the SIT origin set comes from .env.sit / the host env
    # (setenv.sh), same placeholder shape as UAT/PROD. Sample in .env.sit.example.
    allowed-origins: ${WECMS_CORS_ALLOWED_ORIGINS}
  # =============================================================================
  # Credential cipher (legacy pgcrypto-compatible)
  # =============================================================================
  crypto:
    # AES-256-CBC (zero-IV, PKCS#5) seed for the BANK_CERT_INFO / GDT_CERT_INFO
    # password column; SHA-256(seed) is the AES key — byte-identical to the legacy
    # JEX public.encrypt()/decrypt() DB functions. This is a cross-system
    # COMPATIBILITY CONSTANT, not an environment-specific value: it MUST be the
    # same in every profile and equal to the legacy seed, or cert credentials
    # written by one system cannot be read by the other. Same value as the base
    # application.yml — declared here only so local and sit stay self-consistent.
    legacy-cert-seed: ${WECMS_CRYPTO_LEGACY_CERT_SEED}
  # =============================================================================
  # Login Credentials
  # =============================================================================
  login-credentials:
    # GDT (tax-portal) verify-before-save. FALSE on SIT — and NOT flipped to true
    # like exchange-rate.batch above. The blocker here is NOT DB isolation (so the
    # isolated refactor DB does not unblock it): the GDT portal requires an
    # interactive captcha and the challenge-chain (frontend dialog + resume
    # endpoints) has not landed, so enabling it would make any GDT credential save
    # that hits a captcha FAIL — worse than legacy. Flip via
    # WECMS_LOGIN_CREDENTIALS_GDT_VERIFY_ENABLED=true only once the challenge-chain
    # ships AND SIT has a reachable GDT gateway.
    # See docs/audits/login-credentials-legacy-vs-refactor-audit.md (G2).
    gdt-verify-enabled: ${WECMS_LOGIN_CREDENTIALS_GDT_VERIFY_ENABLED}
  # =============================================================================
  # EFS / Van Center
  # =============================================================================
  # Firm-banking payment dispatch via the EFS / VAN gateway. DEV gateway per
  # REST API guide ver 1.2.2 §1.2 (DEV host) + §6 timeouts (connect 3s /
  # read 20s). Endpoint paths are vendor-fixed and default in EfsProperties;
  # only enabled + base-url + partner-id are env-specific. The Van Center API
  # key is NOT held here — it is a per-VAN secret provisioned out-of-band into
  # TB_VAN_API_INFO (B2) and read via VanApiKeyService. `enabled` defaults
  # false (mock active) until the partner instance + IP-whitelist are confirmed
  # (B1 / OQ-PDF-2). WGVN_EFS_204 is NOT configured — absent from guide
  # ver 1.2.2 (OQ-PDF-1).
  dispatch:
    # Hand off a committed non-VND File-path dispatch to the 00301 reception flow
    # (TransferDispatchExecutor → BulkReceptionService.receive, post-commit). Default
    # false → File-path batches stay PROC_STAT='9' (legacy behaviour) until SFTP (B4)
    # + EFS (B1/B2) are provisioned. Turn on only with the gateway fully configured.
    auto-receive: ${WECMS_DISPATCH_AUTO_RECEIVE}
    # Real-time 202 dispatch (port of NAPAS_REAL_TIME_BATCH; VND/API path). Default false
    # → pay-target rows stay PROC_STAT='9' until VAN keys (B2) + EFS (B1) are provisioned.
    realtime-dispatch: ${WECMS_DISPATCH_REALTIME_DISPATCH}
    # Depositor-name inquiry (WGVN_EFS_201; port of WB_00000100). Default false.
    recipient-inquiry: ${WECMS_DISPATCH_RECIPIENT_INQUIRY}
    # Result-check poll (port of PROCESSING_RESULT_CHECK_BATCH). Cron defaults to "-"
    # (never fire) so the refactor never co-processes live 202 rows on the shared dev
    # DB; set a cron only in the env that owns the real-time traffic. Runs every minute
    # when enabled.
    result-check:
      cron: ${WECMS_DISPATCH_RESULT_CHECK_CRON}
    # Inbound EFS callbacks (01301/01302). Permitted in the security chain (no JWT);
    # authenticated by the per-VAN VV/EV crypto check + this source-IP allow-list.
    # allowed-ips empty → no IP restriction (rely on VV crypto) until the gateway IPs
    # are known (B7). Comma-separated env value, e.g. "42.96.55.18,42.96.55.163".
    callback:
      trust-forwarded-for: true
      allowed-ips: ${WECMS_CALLBACK_ALLOWED_IPS}
    efs:
      enabled: ${WECMS_EFS_ENABLED}
      base-url: ${WECMS_EFS_BASE_URL}
      partner-id: ${WECMS_EFS_PARTNER_ID}
      connect-timeout-ms: 3000
      read-timeout-ms: 20000
    # SFTP file channel for the bulk dispatch (00301 upload / 01302 result download).
    # `enabled` defaults false → MockSftpClient is active (no network I/O) until the
    # host/key/source-IP-whitelist are provisioned (B4). The private key path points
    # at a file; the key material itself is NEVER committed (supply via env). Legacy
    # paths: send=sdata, receive=rdata, move=rdata/success; port 3300.
    sftp:
      enabled: ${WECMS_SFTP_ENABLED}
      host: ${WECMS_SFTP_HOST}
      port: ${WECMS_SFTP_PORT}
      username: ${WECMS_SFTP_USERNAME}
      private-key-path: ${WECMS_SFTP_KEY_PATH}
      password: ${WECMS_SFTP_PASSWORD}
      connect-timeout-ms: 60000
      local-upload-path: ${WECMS_SFTP_LOCAL_UPLOAD}
      remote-upload-path: ${WECMS_SFTP_REMOTE_UPLOAD}
      local-download-path: ${WECMS_SFTP_LOCAL_DOWNLOAD}
      remote-download-path: ${WECMS_SFTP_REMOTE_DOWNLOAD}
      remote-move-path: ${WECMS_SFTP_REMOTE_MOVE}
  # =============================================================================
  # File storage
  # =============================================================================
  # All upload modules use:
  #   <storage-root>/<bizKey>/<module-slug>/<file>
  # Each module overrides its root via its WECMS_*_STORAGE_ROOT env var.
  #
  # Payment modules:
  #   Vendor Payment    -> <storage-root>/<bizKey>/vendor-payment/<file>
  #   Expense Payment   -> <storage-root>/<bizKey>/expense-payment/<file>
  #   Payroll           -> <storage-root>/<bizKey>/payroll/<file>
  #   Overseas Payment  -> <storage-root>/<bizKey>/overseas-payment/<file>
  #   Internal Transfer -> <storage-root>/<bizKey>/internal-transfer/<file>
  #
  # Business files:
  #   Contacts                -> <storage-root>/<bizKey>/contacts/<file>
  #   Preferences             -> <storage-root>/<bizKey>/preferences/<file>
  #   User Image              -> <storage-root>/<bizKey>/user-image/<file>
  #   ERP Transaction History -> <storage-root>/<bizKey>/erp-transaction-history/<file>
  #
  # Vendor Payment / Expense Payment / Payroll now have their own storage-root
  # keys (added 2026-06-12); each default mirrors the internal-transfer root so
  # today's layout is unchanged until a key is pointed elsewhere.
  # overseas-payment, preferences and user-image also fall back to a legacy flat
  # root for files written before the multi-tenant split.
  # Most roots default to "C:/WECMS PROJECT/File Data"; internal-transfer and
  # overseas-payment still default to different roots (flagged inline below).
  #
  # TODO (storage-root normalization — UNRESOLVED, do NOT guess): the SIT roots
  # are inconsistent — internal-transfer / overseas-payment / vendor-payment /
  # expense-payment / payroll default to "c:/WeCMS/File Data" while contacts /
  # preferences / user-image / erp-transaction-history default to
  # "C:/WECMS PROJECT/File Data". The canonical SIT path cannot be confirmed from
  # config alone: the real SIT host runs on Linux and sets every WECMS_*_STORAGE_ROOT
  # via externalized env config (setenv.sh under /DATA/src-wecms/...), so these
  # Windows defaults are fallback-only and likely never used on the SIT box.
  # ACTION: confirm the real SIT storage root with ops, then either (a) point every
  # WECMS_*_STORAGE_ROOT env var at it on the host (preferred — config stays env-driven),
  # or (b) collapse all nine defaults below to that single confirmed path. Until
  # confirmed, leave the defaults untouched.
  overseas-payment:
    # storage-root — NON-STANDARD: defaults to "c:/WeCMS/File Data" (aligned
    # 2026-06-12 with internal-transfer / vendor-payment / expense-payment /
    # payroll), differs from the "C:/WECMS PROJECT/File Data" used by the
    # contacts / preferences / user-image / erp-transaction-history modules.
    # Override via WECMS_OVERSEAS_PAYMENT_STORAGE_ROOT.
    storage-root: ${WECMS_OVERSEAS_PAYMENT_STORAGE_ROOT}
  # vendor-payment / expense-payment / payroll — own roots; defaults mirror the
  # (non-standard) internal-transfer root "c:/WeCMS/File Data" so today's layout
  # is unchanged. Flagged for normalization alongside internal-transfer.
  vendor-payment:
    storage-root: ${WECMS_VENDOR_PAYMENT_STORAGE_ROOT}
  expense-payment:
    storage-root: ${WECMS_EXPENSE_PAYMENT_STORAGE_ROOT}
  payroll:
    storage-root: ${WECMS_PAYROLL_STORAGE_ROOT}
  contacts:
    storage-root: ${WECMS_CONTACTS_STORAGE_ROOT}
  preferences:
    storage-root: ${WECMS_PREFERENCES_STORAGE_ROOT}
  user-image:
    # Save filename is an opaque HMAC token (defence-in-depth on top of
    # tenant isolation).
    storage-root: ${WECMS_USER_IMAGE_STORAGE_ROOT}
  erp-transaction-history:
    storage-root: ${WECMS_ERP_TRANSACTION_HISTORY_STORAGE_ROOT}
  # internal-transfer is listed last in this section because its YAML key also
  # carries the Banking Cut-off Configuration (next section): Spring binds that
  # under wecms.internal-transfer.cutoff, so it must stay nested under this key.
  internal-transfer:
    # storage-root — NON-STANDARD: defaults to "c:/WeCMS/File Data", differs from
    # the "C:/WECMS PROJECT/File Data" used by the other modules. Leftover
    # per-box path from the 2026-05-26 server-config merge (commit a55344a);
    # flagged for normalization. Override via WECMS_INTERNAL_TRANSFER_STORAGE_ROOT.
    storage-root: ${WECMS_INTERNAL_TRANSFER_STORAGE_ROOT}

    # Banking cut-off windows (wecms.internal-transfer.cutoff) are defined once
    # in the base application.yml (Shinhan / Woori / VCB incl. CITAD-via-API
    # 16:30 + VCB ≥500M tier) and inherited here — no SIT override needed. Bank
    # identity is resolved from TB_FIRM_BANK_CODE.ENG_ABRVAT_NM, so the
    # WECMS_SHINHAN_BANK_CD / WECMS_WOORI_BANK_CD env vars are no longer consumed.

  # =============================================================================
  # Exchange-rate collection batch (Shinhan + Woori FX scraping)
  # =============================================================================
  # ON by default on SIT. SIT runs against its OWN isolated refactor DB instance
  # (separate from the legacy JEX database — same schema/DDL/tables/functions, but
  # a distinct instance), so the refactor FX batch writing BANK_EXCH_RATE_INFM
  # cannot double-write or race the legacy JEX batch. SIT therefore genuinely owns
  # FX collection and exercises the real batch. Set
  # WECMS_EXCHANGE_RATE_BATCH_ENABLED=false to disable for a one-off run.
  exchange-rate:
    batch:
      enabled: ${WECMS_EXCHANGE_RATE_BATCH_ENABLED}

  # Operation Status Inquiry batch (legacy OPRT_0001_001 seed / OPRT_0010_001 refresh).
  # OFF by default — the legacy JEX batch still owns OPRT_STTS_INFO on the shared DB.
  # Crons are PLACEHOLDERS until the JEX batch-admin schedule is confirmed (audit OQ-1).
  operation-status:
    batch:
      enabled: ${WECMS_OPERATION_STATUS_BATCH_ENABLED}
      seed-cron: ${WECMS_OPERATION_STATUS_BATCH_SEED_CRON}
      refresh-cron: ${WECMS_OPERATION_STATUS_BATCH_REFRESH_CRON}

  # =============================================================================
  # Coocon
  # =============================================================================
  coocon:
    # No values committed here — all come from .env.sit / the host env (setenv.sh),
    # same placeholder shape as UAT/PROD. .env.sit.example carries the DEV host URLs
    # as samples; keys are supplied per host (rotate the old keys still in git
    # history — see docs/security/required-environment-secrets.md). Single source of
    # truth for BOTH the FX-rate batch AND the bank-scraping flow.
    api-key: ${WECMS_COOCON_API_KEY}
    api-url: ${WECMS_COOCON_API_URL}
    smart-api-key: ${WECMS_COOCON_SMART_API_KEY}
    smart-api-url: ${WECMS_COOCON_SMART_API_URL}
    unique-key: ${WECMS_COOCON_UNIQUE_KEY}

  # --- GDT lookup (OSMC) — same Coocon bigdata gateway as coocon.api-url ---
  # No values committed; all come from .env.sit / host env. Point osmc.url/api-key
  # at the DEV bigdata host/key in .env.sit, else the gateway rejects the call with
  # "등록되지 않은 인증키 입니다" (WBE_OSMC_LOOKUP_FAILED).
  osmc:
    url: ${WECMS_OSMC_URL}
    api-key: ${WECMS_OSMC_API_KEY}
    api-id: ${WECMS_OSMC_API_ID}
    unique-key: ${WECMS_OSMC_UNIQUE_KEY}

# =============================================================================
# HAENGSUNG Oracle ERP integration
# =============================================================================
# Same property bindings as the base application.yml, declared per-profile for
# explicit visibility. OFF by default; real values resolve from env vars on the
# SIT host. No secrets in YAML.
haengsung:
  oracle:
    enabled: ${HAENGSUNG_ORACLE_ENABLED}
    url: ${HAENGSUNG_ORACLE_URL}
    username: ${HAENGSUNG_ORACLE_USERNAME}
    password: ${HAENGSUNG_ORACLE_PASSWORD}
  scheduled-payment-import:
    enabled: ${HAENGSUNG_SCHEDULED_IMPORT_ENABLED}
    cron: ${HAENGSUNG_SCHEDULED_IMPORT_CRON}
  exchange-rate-sync:
    enabled: ${HAENGSUNG_EXCHANGE_RATE_SYNC_ENABLED}
    cron: ${HAENGSUNG_EXCHANGE_RATE_SYNC_CRON}
  card-account-sync:
    enabled: ${HAENGSUNG_CARD_ACCOUNT_SYNC_ENABLED}
    cron: ${HAENGSUNG_CARD_ACCOUNT_SYNC_CRON}

# =============================================================================
# Logging
# =============================================================================
# F-06: SIT carries production-safe logging levels. The DEBUG body-logging
# filter (RequestResponseLoggingFilter logs at DEBUG) and all SQL statement /
# bind-value logging are OFF so real credentials + PII never reach SIT logs.
# Use the `local` profile (or a local `.env`) for verbose debugging.
logging:
  level:
    com.kosign.wecms: INFO
    org.springframework.security: WARN
    org.hibernate: info
    org.hibernate.SQL: WARN
    org.springframework.jdbc.core: WARN
    org.springframework.jdbc.core.StatementCreatorUtils: WARN
    org.hibernate.orm.jdbc.bind: WARN

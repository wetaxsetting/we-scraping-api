spring:
  application:
    name: wecms-api-main
  profiles:
    active: local
  jpa:
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Local-R&D drift recovery — the developer DB is single-user and
    # often runs against migration files that have been edited after
    # first apply (e.g. a hotfix re-uses the same V-number while the
    # local row is still in `flyway_schema_history`). Two flags keep
    # the dev loop unblocked without compromising prod safety:
    #
    # `out-of-order: true` — lets a newly-added lower-version migration
    #   run even when higher versions are already applied. Required for
    #   normal R&D where V87 lands after V88-V89 already ran.
    #
    # `validate-on-migrate: false` — tolerates checksum drift on
    #   already-applied migrations so the app boots even when the file
    #   text changed. UAT/PROD profiles deliberately leave this at the
    #   default `true` (strict) so production never starts with a
    #   silently-modified migration history.
    out-of-order: true
    validate-on-migrate: false
  messages:
    basename: messages
    encoding: UTF-8
  servlet:
    multipart:
      # Settings > Contacts attachments cap — 10 MB per file, 50 MB
      # per request (matches ContactsFileService.MAX_FILE_SIZE_BYTES).
      # Container-level guard so an oversized upload is rejected before
      # the service-layer envelope fires; both layers are needed because
      # the container 413 path produces a non-WBE response otherwise.
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080
  error:
    include-message: always
    include-stacktrace: never

# Surface the per-request traceId (set by TraceIdFilter into MDC under key
# `traceId`) in every log line. The `--` placeholder shows when the
# logger fires outside a request scope (startup, scheduled jobs).
logging:
  pattern:
    level: "%5p [traceId=%X{traceId:--}]"

wecms:
  jwt:
    # Required. Fail-fast validated by JwtTokenProvider:
    #   >= 32 bytes  -> HS256
    #   >= 64 bytes  -> HS512 (preferred)
    # Generate with:  openssl rand -hex 64
    secret: ${WECMS_JWT_SECRET}
    expires-in-seconds: 3600
    issuer: wecms-api-main
  cors:
    allowed-origins: http://localhost:3000
  tenant:
    # Dormant config slot. Spring no longer auto-creates company/admin
    # data at startup — the BootstrapRunner that previously consumed
    # this property has been removed. Login resolves the active tenant
    # per user from USER_BUSI_CONN_INFM (multi-company; see AuthService)
    # and stamps the chosen BIZ_KEY into the signed JWT claim that
    # JwtAuthenticationFilter reads into TenantContext.
    #
    # Operational practice: a DBA creates a new company + first admin
    # by running the legacy manual setup SQL pattern against the target
    # database (see Claude Code (AI)/sql/setup_uat_account_*.sql).
    # Local R&D tenants are seeded via Flyway (V2 / V5 for 000001,
    # V73 for 000014 = HAENGSUNG ELECTRONICS).
    #
    # The value is retained only so TenantProperties stays bindable
    # and so CompanyBootstrapService.assertConsistent(...) has a
    # comparison target if anyone ever calls bootstrap programmatically
    # from a unit test or a future admin API.
    biz-key: VN_VNM0004_000001
  erp-transaction-history:
    # Local-disk root for downloadable ERP transaction history files.
    # Resolved path pattern: <storage-root>/<biz_key>/erp-transaction-history/<save_file_nm>
    # OQ-3 resolved 2026-05-11 — defaults to the developer's standard
    # workspace; per-developer override via env var
    # WECMS_ERP_TRANSACTION_HISTORY_STORAGE_ROOT (Windows / POSIX both
    # honour Java Paths.get(...)). Profile-specific overrides live in
    # application-{profile}.yml.
    storage-root: ${WECMS_ERP_TRANSACTION_HISTORY_STORAGE_ROOT:./tmp/erp-trns-hstr}
  contacts:
    # Local-disk root for Settings > Contacts attachments
    # (TRCO_INFO_FILE — V98). Resolved path pattern:
    #   <storage-root>/<biz_key>/contacts/<save_file_nm>
    # Per-developer override via env var WECMS_CONTACTS_STORAGE_ROOT.
    # Default mirrors the ERP Transaction History neighbour so all file
    # storage stays under one tree on a developer laptop.
    storage-root: ${WECMS_CONTACTS_STORAGE_ROOT:./tmp/contacts}
